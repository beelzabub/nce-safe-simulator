# ─────────────────────────────────────────────────────────────────────────────
# Pipeline router (issue #283)
#
# Default (no variable): the baseline pipeline — `test` + `containerize`,
# exactly as it was before the router (issue #275's ground zero). Every push
# and merge takes this path; nothing about it changed.
#
# RECIPE=<name>: the baseline jobs sit out and the `recipe` trigger job runs
# ci-recipes/<name>.yml as a child pipeline instead. Start one from
# CI/CD → Pipelines → Run pipeline (add variable RECIPE), or:
#
#   glab ci run -b <branch> --variables RECIPE:smoke
#
# Extra variables on the same run are forwarded to the child pipeline
# (trigger:forward:pipeline_variables), so recipes can take parameters. A
# pipeline SCHEDULE that defines RECIPE runs that recipe on its cron — e.g.
# a weekly all-reports. Recipe list + authoring guide: ci-recipes/README.md.
# ─────────────────────────────────────────────────────────────────────────────
image: python:latest

# ── Security scanners run in the PARENT pipeline, not the child router (#315) ──
# The recipe router (below) runs recipes as CHILD pipelines via trigger:include,
# because a top-level include can't interpolate the run-time $RECIPE in its path.
# But GitLab's Vulnerability Report reconciles the project register only from the
# DEFAULT-BRANCH parent pipeline's own security reports — a scanner one level down
# in a child never updates it. That is #315: a green RECIPE=security-all sweep
# scanned fine but left the register frozen until it was reconciled by hand.
#
# So security is exempted from the router and included here as parent-level jobs
# instead: a STATIC path (no $RECIPE interpolation to defer), gated by a rule on
# the same RECIPE value. On a default-branch run — manual or a scheduled
# RECIPE=security-all — the scanners are now the parent's own jobs and the
# register reconciles natively. Feature-branch runs still feed the MR security
# widget, exactly as before. The router keeps handling every non-security recipe,
# where the child-pipeline model is fine (those don't feed the security board).
include:
  - local: 'ci-recipes/security-all.yml'
    rules:
      - if: '$RECIPE == "security-all"'

stages:
  - build
  - test          # GitLab's security templates place their jobs here (#315)
  - containerize

# The router itself: resolves which recipe file to run only when the trigger
# job actually starts, so the run-time RECIPE variable works here (top-level
# `include:` could not do this — it resolves before the pipeline exists).
recipe:
  stage: build
  rules:
    # security-all is handled as parent-level jobs (the top-level include above),
    # so it must NOT also spawn a child here — that child pipeline is exactly what
    # bypassed the Vulnerability Report (#315). Every other recipe still routes to
    # a child pipeline, where the child model is fine.
    - if: '$RECIPE == "security-all"'
      when: never
    - if: $RECIPE
  trigger:
    include:
      - local: 'ci-recipes/$RECIPE.yml'
    # Parent reflects the child's result — a red recipe is a red pipeline.
    strategy: depend
    forward:
      # Hand the Run-pipeline variables through to the child: recipes are
      # parameterized by extra variables on the same run (e.g. TOOL=...).
      pipeline_variables: true

test:
  stage: build
  # The pipeline's own dev image (issue #279): built FROM runtime, so the
  # WeasyPrint system closure (Pango + fonts, issues #261/#269) and
  # requirements.txt (incl. pytest) are already baked in — the job makes no
  # package fetches at all; its one external need is this pull from the
  # project's own registry. No entrypoint override needed (the dev stage
  # sets ENTRYPOINT [], unlike the runtime image the report recipes blank).
  # This is the image from the LAST default-branch merge — containerize runs
  # after test — so pip install below catches Python deps added since; a
  # branch changing system-level deps in the Dockerfile won't see them in
  # its own test runs until merged (accepted, see #279).
  # Bootstrap: a fresh import (e.g. an enclave lift without the image phase)
  # has no dev image yet — run RECIPE=containerize-bootstrap once to build
  # and push it; see ci-recipes/README.md.
  image: $CI_REGISTRY_IMAGE/dev:latest
  rules:
    # Recipe runs route to the child pipeline only — the baseline sits out.
    - if: $RECIPE
      when: never
    # Pre-router, this job had no rules at all — and rule-less jobs never run
    # in merge_request_event pipelines. Keep that so an open MR doesn't get a
    # duplicate MR pipeline alongside the branch pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    # Otherwise unchanged from the pre-router baseline: run in every pipeline.
    - when: on_success
  script:
    # config.json is git-ignored, so a clean CI checkout has none; several test
    # modules read it at import time. Seed it from the tracked template.
    - test -f config.json || cp config.example.json config.json
    # public/ is a git-ignored build artifact; the server only registers its
    # static mount when the dir exists (server/app.py). Create it so the
    # mount-registration test reflects a real deployment (the content probe
    # skips itself when the dir is empty).
    - mkdir -p public
    # The image already satisfies requirements.txt; this catches deps added
    # on the branch since the image was last built (seconds when unchanged).
    - pip install -r requirements.txt
    - python -m pytest tests/

# Build and push the runtime + dev containers to the project's GitLab Container
# Registry on every merge to the default branch (issue #244; develop here,
# main on the lifted enclave repo). Kaniko needs no privileged
# Docker daemon; it authenticates with the built-in per-job $CI_JOB_TOKEN, so no
# registry secret has to be configured. Images land at:
#   $CI_REGISTRY_IMAGE          → runtime (the served app), :latest + :<sha>
#   $CI_REGISTRY_IMAGE/dev      → dev/build toolchain image, :latest + :<sha>
# Note: gitlab.com shared runners are amd64, so these images are amd64. The
# arm64 (Graviton) deploy path is unchanged — it still builds via cdk ecr-push.
containerize:
  stage: containerize
  # Gate on `test` so we never publish an image built from a red suite.
  needs:
    - test
  # Runners with Docker init injection (FF_USE_INIT_WITH_DOCKER_EXECUTOR;
  # hardwired on in Runner 16.6.0) bind-mount a supervisor at
  # /sbin/docker-init, which breaks kaniko's /sbin replacement on Debian
  # usrmerge bases with "device or resource busy" (issue #276, upstream
  # kaniko#946). Two independent guards, each inert when the other applies:
  # this variable turns the injection off at the source (job-level wins
  # unless the flag is pinned in the runner's own config.toml), and
  # --ignore-path=/sbin below makes kaniko skip the /sbin swap entirely.
  variables:
    FF_USE_INIT_WITH_DOCKER_EXECUTOR: "false"
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    # PKG_PROJECT points the Dockerfile's registry fetches (Quarto, issue
    # #262; apt-debs system packages, issue #269) at THIS instance's package
    # registry — composed from CI variables, so the same yaml pulls from
    # gitlab.com here and from the enclave's own registry after the repo is
    # lifted. See README → "Enclave transfer".
    #
    # --ignore-path=/sbin (issue #276): with the runner's docker-init
    # bind-mounted inside /sbin, kaniko's usrmerge symlink swap does
    # RemoveAll("/sbin") and dies on the live mount — the ignore list is
    # never consulted for a removed path's children (kaniko#946), so
    # ignoring /sbin/docker-init alone does NOT work; the whole /sbin entry
    # must be skipped. Build-time /sbin stays a plain dir (real binaries
    # live in /usr/sbin on usrmerge Debian; nothing in the Dockerfile uses
    # a literal /sbin/ path) and the pushed image is unaffected — kaniko
    # ships the base layers unmodified, so the base's sbin symlink arrives
    # intact. Inert on runners without init injection (gitlab.com).
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --target runtime
      --ignore-path=/sbin
      --build-arg VCS_REF="$CI_COMMIT_SHORT_SHA"
      --build-arg PKG_PROJECT="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --target dev
      --ignore-path=/sbin
      --build-arg PKG_PROJECT="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      --destination "$CI_REGISTRY_IMAGE/dev:latest"
      --destination "$CI_REGISTRY_IMAGE/dev:$CI_COMMIT_SHORT_SHA"
  rules:
    # Recipe runs route to the child pipeline only — the baseline sits out.
    # The guard matters here especially: recipe runs arrive as source "web"
    # or "api", which the opt-in rule below would otherwise match.
    - if: $RECIPE
      when: never
    # Default branch, not a hardcoded name: `develop` here, `main` on the
    # lifted enclave repo — the same yaml rebuilds images on both (issue #262).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Opt-in from any branch: an explicitly requested pipeline (Run pipeline
    # button → source "web", pipelines API → source "api") also builds the
    # image, so an MR branch can prove the full build before it gates the
    # default branch — e.g. auditing #269's registry-only apt closure from
    # the job log. Ordinary pushes stay test-only. A pipeline-variable gate
    # would be cleaner, but this project caps variable overrides at owner.
    # Tags carry the branch SHA; the next default-branch pipeline reclaims
    # :latest.
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
