image: python:latest

stages:
  - build
  - containerize

test:
  stage: build
  image: python:3.11          # match the runtime image (Dockerfile: python:3.11-slim)
  script:
    # WeasyPrint (epic-cards, #249) renders a real PDF in the suite and needs
    # Pango + a font at the system level — pip can't supply these. Mirrors the
    # runtime-image apt install in the Dockerfile.
    - apt-get update && apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
    # config.json is git-ignored, so a clean CI checkout has none; several test
    # modules read it at import time. Seed it from the tracked template.
    - test -f config.json || cp config.example.json config.json
    # public/ is a git-ignored build artifact; the server only registers its
    # static mount when the dir exists (server/app.py). Create it so the
    # mount-registration test reflects a real deployment (the content probe
    # skips itself when the dir is empty).
    - mkdir -p public
    - pip install -r requirements.txt
    - python -m pytest tests/

# TEMPORARY (issue #249) — demonstrate the preflight dependency gate in a real
# CI job. Two deliberately-absent deps (mixins/preflight.py DEP_CHECKS "demo_*")
# are wired into the epic-cards (pdf) profile, so running the tool makes the gate
# report BOTH a missing python package AND a missing system binary at once and
# exit 2 — before any GitLab connection (the gate now runs before the client is
# built, so no token is needed). allow_failure keeps the pipeline green. Remove
# this job and the two demo deps after reviewing the output.
preflight-demo:
  stage: build
  image: python:3.11
  allow_failure: true
  before_script:
    # Install the REAL deps so only the two fake demo deps show as missing —
    # a crisp gap report rather than a wall of everything-absent.
    - apt-get update && apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
    - pip install --no-cache-dir -r requirements.txt
  script:
    - echo "Running a tool (epic-cards) — expect the preflight gate to stop it with two missing deps:"
    - python NceGitLab.py -ut epic-cards --output_path /tmp/cards.pdf
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/249-epic-print-cards"'

# Build and push the runtime + dev containers to the project's GitLab Container
# Registry on every merge to develop (issue #244). Kaniko needs no privileged
# Docker daemon; it authenticates with the built-in per-job $CI_JOB_TOKEN, so no
# registry secret has to be configured. Images land at:
#   $CI_REGISTRY_IMAGE          → runtime (the served app), :latest + :<sha>
#   $CI_REGISTRY_IMAGE/dev      → dev/build toolchain image, :latest + :<sha>
# Note: gitlab.com shared runners are amd64, so these images are amd64. The
# arm64 (Graviton) deploy path is unchanged — it still builds via cdk ecr-push.
containerize:
  stage: containerize
  # Gate on `test` so we never publish an image built from a red suite.
  needs:
    - test
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --target runtime
      --build-arg VCS_REF="$CI_COMMIT_SHORT_SHA"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --target dev
      --destination "$CI_REGISTRY_IMAGE/dev:latest"
      --destination "$CI_REGISTRY_IMAGE/dev:$CI_COMMIT_SHORT_SHA"
  only:
    - develop
