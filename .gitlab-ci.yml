image: python:latest

stages:
  - build
  - containerize

test:
  stage: build
  image: python:3.11          # match the runtime image (Dockerfile: python:3.11-slim)
  script:
    # WeasyPrint (epic-cards, #249) renders a real PDF in the suite and needs
    # Pango + a font at the system level — pip can't supply these. The .debs
    # are served from this project's generic package registry (package
    # weasyprint-apt-debs, issue #261) instead of deb.debian.org: no external
    # mirror dependency, no apt index download. Captured from amd64
    # python:3.11 (trixie); refresh procedure in README → "CI system packages".
    - PKG="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/weasyprint-apt-debs/2026.07.21"
    - >-
      for f in libpango-1.0-0_1.56.3-1_amd64.deb libpangoft2-1.0-0_1.56.3-1_amd64.deb fonts-dejavu-core_2.37-8_all.deb;
      do curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" -o "/tmp/$f" "$PKG/$f"; done
    - dpkg -i /tmp/libpango-1.0-0_1.56.3-1_amd64.deb /tmp/libpangoft2-1.0-0_1.56.3-1_amd64.deb /tmp/fonts-dejavu-core_2.37-8_all.deb
    # config.json is git-ignored, so a clean CI checkout has none; several test
    # modules read it at import time. Seed it from the tracked template.
    - test -f config.json || cp config.example.json config.json
    # public/ is a git-ignored build artifact; the server only registers its
    # static mount when the dir exists (server/app.py). Create it so the
    # mount-registration test reflects a real deployment (the content probe
    # skips itself when the dir is empty).
    - mkdir -p public
    - pip install -r requirements.txt
    - python -m pytest tests/

# Build and push the runtime + dev containers to the project's GitLab Container
# Registry on every merge to the default branch (issue #244; develop here,
# main on the lifted enclave repo). Kaniko needs no privileged
# Docker daemon; it authenticates with the built-in per-job $CI_JOB_TOKEN, so no
# registry secret has to be configured. Images land at:
#   $CI_REGISTRY_IMAGE          → runtime (the served app), :latest + :<sha>
#   $CI_REGISTRY_IMAGE/dev      → dev/build toolchain image, :latest + :<sha>
# Note: gitlab.com shared runners are amd64, so these images are amd64. The
# arm64 (Graviton) deploy path is unchanged — it still builds via cdk ecr-push.
containerize:
  stage: containerize
  # Gate on `test` so we never publish an image built from a red suite.
  needs:
    - test
  # Runners with Docker init injection (FF_USE_INIT_WITH_DOCKER_EXECUTOR;
  # hardwired on in Runner 16.6.0) bind-mount a supervisor at
  # /sbin/docker-init, which breaks kaniko's /sbin replacement on Debian
  # usrmerge bases with "device or resource busy" (issue #276, upstream
  # kaniko#946). Two independent guards, each inert when the other applies:
  # this variable turns the injection off at the source (job-level wins
  # unless the flag is pinned in the runner's own config.toml), and
  # --ignore-path=/sbin below makes kaniko skip the /sbin swap entirely.
  variables:
    FF_USE_INIT_WITH_DOCKER_EXECUTOR: "false"
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    # PKG_PROJECT points the Dockerfile's registry fetches (Quarto, issue
    # #262; apt-debs system packages, issue #269) at THIS instance's package
    # registry — composed from CI variables, so the same yaml pulls from
    # gitlab.com here and from the enclave's own registry after the repo is
    # lifted. See README → "Enclave transfer".
    #
    # --ignore-path=/sbin (issue #276): with the runner's docker-init
    # bind-mounted inside /sbin, kaniko's usrmerge symlink swap does
    # RemoveAll("/sbin") and dies on the live mount — the ignore list is
    # never consulted for a removed path's children (kaniko#946), so
    # ignoring /sbin/docker-init alone does NOT work; the whole /sbin entry
    # must be skipped. Build-time /sbin stays a plain dir (real binaries
    # live in /usr/sbin on usrmerge Debian; nothing in the Dockerfile uses
    # a literal /sbin/ path) and the pushed image is unaffected — kaniko
    # ships the base layers unmodified, so the base's sbin symlink arrives
    # intact. Inert on runners without init injection (gitlab.com).
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --target runtime
      --ignore-path=/sbin
      --build-arg VCS_REF="$CI_COMMIT_SHORT_SHA"
      --build-arg PKG_PROJECT="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      --destination "$CI_REGISTRY_IMAGE:latest"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --target dev
      --ignore-path=/sbin
      --build-arg PKG_PROJECT="$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      --destination "$CI_REGISTRY_IMAGE/dev:latest"
      --destination "$CI_REGISTRY_IMAGE/dev:$CI_COMMIT_SHORT_SHA"
  rules:
    # Default branch, not a hardcoded name: `develop` here, `main` on the
    # lifted enclave repo — the same yaml rebuilds images on both (issue #262).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    # Opt-in from any branch: an explicitly requested pipeline (Run pipeline
    # button → source "web", pipelines API → source "api") also builds the
    # image, so an MR branch can prove the full build before it gates the
    # default branch — e.g. auditing #269's registry-only apt closure from
    # the job log. Ordinary pushes stay test-only. A pipeline-variable gate
    # would be cleaner, but this project caps variable overrides at owner.
    # Tags carry the branch SHA; the next default-branch pipeline reclaims
    # :latest.
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
