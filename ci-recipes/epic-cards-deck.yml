# ─────────────────────────────────────────────────────────────────────────────
# Recipe: epic-cards deck as a pipeline artifact
#
# Run it:   CI/CD → Pipelines → Run pipeline, variable RECIPE=epic-cards-deck
#           (or: glab ci run -b <branch> --variables RECIPE:epic-cards-deck)
#
# Renders the filtered epics as a print-ready "Capability Card" PDF and
# publishes it as a downloadable job artifact.
#
# The job runs inside the project's OWN runtime image from the Container
# Registry: Pango, fonts, and every pip requirement are already baked in, so
# there is no apt/PyPI dependency at job time — this recipe works as-is on an
# air-gapped GitLab instance once the image has been imported or built there
# (README → "Enclave transfer"). A standalone python:3.11 variant that installs
# its own deps from the internet is at the bottom for spaces without the image.
#
# Prerequisites in YOUR space (this source repo ships neither a token nor a
# config.json — config.json is git-ignored and the template's token is blank):
#   • The runtime image exists in the Container Registry — i.e. the
#     `containerize` job has run at least once on your instance, or you
#     imported the image during an enclave lift.
#   • A GitLab token with 'api' scope. Provide it EITHER by setting a masked
#     CI/CD variable GITLAB_API_TOKEN (recommended — keeps it out of git), OR by
#     committing your own config.json with the token filled in. NOTE: a CI/CD
#     variable marked "Protected" is only injected into pipelines on protected
#     refs — if the recipe's branch isn't protected the variable arrives empty.
#   • config.json          — url, private_token, parent_group. Seeded from
#                            config.example.json below if your repo doesn't carry one.
#   • epic-cards-spec.json  — the 'filter' + 'taxonomy' whitelists that define
#                            which epics render and how their labels are classified.
# ─────────────────────────────────────────────────────────────────────────────
stages: [deck]

epic-cards-deck:
  stage: deck
  image:
    name: $CI_REGISTRY_IMAGE:latest
    # The runtime image's ENTRYPOINT is the served app — it would swallow the
    # runner's job script. Blank it so the runner gets a plain shell.
    entrypoint: [""]
  before_script:
    # The image already satisfies requirements.txt; this catches deps added on
    # the branch since the image was last built (seconds when nothing changed).
    - pip install --no-cache-dir -r requirements.txt
    # config.json is git-ignored, so a fresh fork may not carry one — seed it
    # from the tracked template (blank token), then fill the token from the
    # masked CI/CD variable if you're keeping it out of git.
    - test -f config.json || cp config.example.json config.json
    - if [ -n "$GITLAB_API_TOKEN" ]; then
        python -c "import json,os; c=json.load(open('config.json')); c['private_token']=os.environ['GITLAB_API_TOKEN']; json.dump(c,open('config.json','w'),indent=2)";
      fi
  script:
    # No prompts in CI: options you don't pass take their defaults — group
    # from config.json, filter + taxonomy from epic-cards-spec.json. Layout is
    # pinned explicitly here (landscape sheet, 1 card per page — drop or change
    # the flags for portrait/2-up/4-up); the output path is pinned so the
    # artifact has a stable name.
    - python NceGitLab.py -ut epic-cards --orientation landscape --per_page 1 --output_path capability-cards.pdf
  artifacts:
    name: "capability-cards-$CI_COMMIT_SHORT_SHA"
    paths:
      - capability-cards.pdf
    expire_in: 30 days

