# ─────────────────────────────────────────────────────────────────────────────
# Recipe: secret detection (issue #283)
#
# Run it:   pipeline with variable RECIPE=security-secret-detection
#           (see ci-recipes/README.md → "How to run one" for the two ways)
#
# Includes GitLab's maintained Secret Detection template (Gitleaks-based). By
# default it scans the current state of the repo plus the commits new to the
# ref — leaked tokens, keys, and credentials in code, config, and history.
#
# Full-history sweep: set SECRET_DETECTION_HISTORIC_SCAN=true on the run (as a
# second variable, same mechanism as RECIPE) to walk every commit ever made —
# the right first run for a repo that predates secret scanning, slower on big
# histories.
#
# Where the findings land (Ultimate):
#   • this pipeline → Security tab
#   • Secure → Vulnerability report (after a default-branch run)
#   • gl-secret-detection-report.json job artifact
# Wiki page "Security scanning/Secret Detection" walks the UI.
# ─────────────────────────────────────────────────────────────────────────────
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
