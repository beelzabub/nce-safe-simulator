image:
  repository: ""
  # Immutable tag of the image to run (e.g. 0.1.0-dev-abc1234). Deliberately
  # empty: the deploy targets resolve and pass it (--set image.tag=...), and
  # the chart refuses to render without one — a :latest release is not
  # reproducible and cannot be rolled back (issue #290).
  tag: ""
  pullPolicy: Always

replicaCount: 1

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

serviceAccount:
  # Set to true only when deploying without CDK (CDK creates the SA with IRSA by default)
  create: false
  name: nce-app
  roleArn: ""

config:
  param: /nce/config
  awsRegion: us-east-1
  grafanaUrl: ""

efs:
  fileSystemId: ""
  accessPoints:
    config: ""
    reports: ""
    interactive: ""
    quartoSite: ""

ingress:
  albSgId: ""
