apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # The app makes AWS API calls via IRSA, which injects its own projected
      # token — the default kube-api token is unused, so don't mount it.
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required — pass the immutable tag ecr-push printed (issue #290)" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "/app/scripts/entrypoint-eks.sh"]
          # Non-root (#304): the app-wide port move to unprivileged 8080 that
          # the #287 triage deferred. The image runs as uid 1000 (`USER app`),
          # so no capabilities are needed at all — drop everything.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: CONFIG_PARAM
              value: {{ .Values.config.param | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.config.awsRegion | quote }}
            {{- if .Values.config.grafanaUrl }}
            - name: GRAFANA_URL
              value: {{ .Values.config.grafanaUrl | quote }}
            {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
          volumeMounts:
            - name: nce-config
              mountPath: /mnt/config
            - name: nce-reports
              mountPath: /app/reports
            - name: nce-interactive
              mountPath: /app/public/interactive
            - name: nce-quarto-site
              mountPath: /app/quarto-site
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: nce-config
          persistentVolumeClaim:
            claimName: nce-config
        - name: nce-reports
          persistentVolumeClaim:
            claimName: nce-reports
        - name: nce-interactive
          persistentVolumeClaim:
            claimName: nce-interactive
        - name: nce-quarto-site
          persistentVolumeClaim:
            claimName: nce-quarto-site
