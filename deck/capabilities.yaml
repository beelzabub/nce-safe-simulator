# Capability-area content for deck/build_deck.py.
#
# This is a maintained mapping, not re-derived from GitLab on every build: clustering 160+
# issues into capability areas is a judgment call, and re-running a semantic pass each
# build would be non-deterministic and cost an LLM call for no real benefit. When new
# issues land that don't fit an existing area, add them here by hand (or bump `count` and
# add a bullet) rather than regenerating this file wholesale.
#
# image: path resolved first under the screenshots dir (produced by capture_screenshots.py) —
#   "<name>_dark.png" / "<name>_light.png" from ui_shots/live_run_shots, "reports_quarto/<name>.png"
#   from quarto_shots, or "architecture/<name>.png" from capture_diagrams.py — then, if not found
#   there, repo-relative (so a capability can point at curated media/ imagery). Omit for text-only.
# inset_image / inset_label: optional — a small magnifier-style closeup chip pinned to the bottom-
#   right of the main image (e.g. the deployed-version badge). "00-home-version-closeup.png" is
#   generated at build time by build_deck.py.

