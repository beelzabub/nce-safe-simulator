# Shot list for deck/capture_screenshots.py.
#
# ui_shots: opens a dialog/panel in the web UI and captures it (dark + light by default).
#   expand: category accordion headers to click first (in order)
#   select: job-list item text to click (opens its parameter dialog)
#   click:  a raw Playwright selector — or a list of them, clicked in order — instead
#           of/in addition to select (used for chrome elements that aren't job-list
#           items, e.g. "Run Reports…", or multi-step paths like tab → analysis row)
#
# live_run_shots: like ui_shots, but the selected tool is parameterless and read-only,
#   so selecting it launches immediately. Captured once (dark only) to avoid running the
#   live job twice per build. NEVER add a mutating tool here.
#
# quarto_shots: a single screenshot of a rendered Quarto report page, no theme toggle
#   (the Quarto site doesn't follow the app's dark/light toggle).
#
# login_shots: the /login front door itself — captured WITHOUT seeding the auth gate
#   (unlike ui_shots) so the real background slideshow shows, with the DoD banner
#   pre-acknowledged so the nav chevrons (issue #187) aren't hidden behind it.

app_url: "https://nce-safe-sim.com/app/"
quarto_base_url: "https://nce-safe-sim.com/quarto/"

# Tools intentionally WITHOUT a screenshot (issue #258, Gap C): bulk data
# mutators, cleaners, and label ops driven from the CLI, not captured as
# individual dialogs. deck_checks.py flags any tool that is neither shot nor
# listed here, so a NEW user-facing tool can't silently go uncaptured.
excluded_tools:
  # bulk seeders / scaffolding data ops
  - scaffold
  - generate-epic-blocks
  - generate-issue-blocks
  - generate-risk-reasons
  - close-percent
  - reset-pi-progress
  - setup-bv-field
  - update-weights
  - orphan-epics
  - orphan-issues
  # bulk label / weight setters and strippers
  - set-epic-states
  - set-issue-weights
  - set-piid-labels
  - set-project-labels
  - set-risk-labels
  - set-work-type-labels
  - set-wsjf-labels
  - strip-issue-weights
  - strip-labels
  - strip-lifecycle-labels
  - strip-piid-labels
  - strip-project-labels
  - strip-work-type-labels
  - strip-wsjf-labels
  - strip-business-value
  - clean-epic-blocks
  # destructive cleaners
  - clean-wikis
  - clean-roam-risks
  # readonly diagnostics not individually captured
  - audit-labels
  - validate-weights
  - weight-drift-check
  - clean-reports
  - clean-logs

