    expand: ["LABEL MANAGEMENT"]
    select: "Set Lifecycle Labels"
  - out: 09-roam-risk-generate
    title: "ROAM Risk — Generate ROAM Risks"
    expand: ["ROAM RISK"]
    select: "Generate ROAM Risks"
  - out: 10-initial-setup-create-lorem-data
    title: "Initial Setup — Create Lorem Data"
    expand: ["INITIAL SETUP"]
    select: "Create Lorem Data"
  - out: 11-weights-scoring-business-value
    title: "Weights & Scoring — Set Business Value"
    expand: ["WEIGHTS & SCORING"]
    select: "Set Business Value"
  - out: 12-wiki-management-list-wikis
    title: "Wiki Management — List Wikis"
    expand: ["WIKI MANAGEMENT"]
    select: "List Wikis"
  - out: 13-audit-validation-audit-hierarchy
    title: "Audit & Validation — Audit Hierarchy"
    expand: ["AUDIT & VALIDATION"]
    select: "Audit Hierarchy"
  - out: 16-config-connection
    title: "Web UI — Config: GitLab Connection & Private Token"
    click: "button.config-btn"

# "Other" only has one tool (Diagnose) and it's parameterless/read-only, so it belongs here,
# not in ui_shots — selecting it launches the job immediately, there's no dialog to screenshot.
live_run_shots:
  - out: 14-live-job-diagnose
    title: "Live Job Demo — Diagnose"
    expand: ["OTHER"]
    select: "Diagnose"

