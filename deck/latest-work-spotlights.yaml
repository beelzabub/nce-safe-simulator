# Latest-Work spotlight slides for the status deck (build_deck.py --spotlights).
#
# One entry = one spotlight detail slide in the "Latest Work" section. Related
# issues that merged this week are grouped onto a single slide here (list them
# in `issues`); this grouping is authored, not derived — the weekly build's
# authoring step rewrites this file from the `slides`-labeled issues closed in
# the current work week. See deck/README.md and issue #213.
#
# A single issue (or group) may span 2-3 slides when the work is visual enough
# to warrant it (issue #257).
#
# Fields: title, subtitle, bullets[], images[] (screenshot filenames, 0/1/2),
#         image_labels[] (captions for the 2-image layout), caption (1-image),
#         issues[] (source issue numbers — documentation only; `nce-git-ops#N`
#         strings reference the platform repo, per issue #268).
#
# image paths resolve first under deck/screenshots/, then repo-relative — so
# curated committed art (deck/assets/spotlight-extras/, the #243 brief diagrams)
# can be referenced by its repo path (issue #257 items 2-4).

spotlights:
  - title: "CI Recipe Router — One Pipeline File, Many Missions  (#283)"
    subtitle: "RECIPE=<name> runs any job set on demand — the everyday pipeline never changes"
    issues: [283]
    images:
      - "ci-recipe-router.png"
    caption: "The router: no variable → the unchanged baseline; RECIPE=<name> → a self-contained child pipeline from ci-recipes/"
    bullets:
      - "Before: anything beyond the standard pipeline — a full report run, a runner diagnostic, a security scan — meant editing the CI configuration and remembering to revert it afterwards. GitLab has no per-run \"use this CI file instead\" switch, so experiments kept leaking into the pipeline history."
      - "Now the top-level `.gitlab-ci.yml` is a router, written once: with no variable, pushes and merges run the baseline `test` + `containerize` exactly as always; with `RECIPE=<name>` the baseline sits out and `ci-recipes/<name>.yml` runs as a child pipeline instead. Nothing is copied in, nothing needs restoring after."
      - "Ten recipes are on the shelf: a router smoke test, the full report suite, the epic-cards PDF build, the kaniko runner diagnostics from #276, and the six security-scanning recipes — each a self-contained pipeline with its own stages and images."
      - "Extra variables forward into the child, so recipes take parameters; the child's result rolls up as the run's result; and a pipeline schedule that sets `RECIPE` turns any recipe into a recurring job — e.g. a weekly `security-all` audit."

  - title: "Security Scanning Suite — Five GitLab Ultimate Scanners, On Demand  (#283)"
    subtitle: "SAST, secrets, dependencies, container CVEs, IaC — enabled, run, verified, and documented with a wiki walk-through each"
    issues: [283]
    images:
      - "security-scan-findings.png"
    caption: "The first verified security-all sweep — 297 findings across five scanners, every job green"
    bullets:
      - "Five scanners are now enabled as recipes: Semgrep static analysis over the Python and Vue source, Gitleaks secret detection sweeping the entire git history, dependency scanning of requirements + frontend lockfiles (with SBOM), a Trivy CVE scan of our published runtime image, and a KICS misconfiguration scan of cdk/, helm/, and the Dockerfiles. `RECIPE=security-all` runs all five in one child pipeline."
      - "The first verified sweep (2026-07-30) returned 297 findings: two High SAST findings lead the triage queue, dependency scanning lists a fixed version for every one of its seven, and the 205 container CVEs are dominated by the Debian base image — rebuilds clear the fix-available ones."
      - "Secret detection came back clean over the full history — an independent, tool-verified confirmation that the #111 token-scrub removed every trace."
      - "Findings surface in three places: the pipeline's Security tab (per run, any branch), Secure → Vulnerability report (the standing register with dismiss / confirm / create-issue triage, populated once scans run on develop), and the MR security widget; every job also publishes machine-readable gl-*-report.json artifacts."
      - "Each scanner has its own wiki walk-through (Security-scanning/…) of what to explore and how to triage, and every analyzer honors SECURE_ANALYZERS_PREFIX — the whole suite ports to an air-gapped enclave by mirroring the analyzer images."
