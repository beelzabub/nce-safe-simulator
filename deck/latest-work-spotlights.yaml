# Latest-Work spotlight slides for the status deck (build_deck.py --spotlights).
#
# One entry = one spotlight detail slide in the "Latest Work" section. Related
# issues that merged this week are grouped onto a single slide here (list them
# in `issues`); this grouping is authored, not derived — the weekly build's
# authoring step rewrites this file from the `slides`-labeled issues closed in
# the current work week. See deck/README.md and issue #213.
#
# A single issue (or group) may span 2-3 slides when the work is visual enough
# to warrant it (issue #257).
#
# Fields: title, subtitle, bullets[], images[] (screenshot filenames, 0/1/2),
#         image_labels[] (captions for the 2-image layout), caption (1-image),
#         issues[] (source issue numbers — documentation only).
#
# image paths resolve first under deck/screenshots/, then repo-relative — so
# curated committed art (deck/assets/spotlight-extras/, the #243 brief diagrams)
# can be referenced by its repo path (issue #257 items 2-4).

spotlights:
  - title: "Self-Documenting Makefile Help  (#255)"
    subtitle: "Bare `make` now prints a grouped target listing instead of silently launching a build"
    issues: [255]
    images:
      - "deck/assets/spotlight-extras/make-help-root.png"
      - "deck/assets/spotlight-extras/make-help-cdk.png"
    image_labels:
      - "Root `make` — reports, deploy, container, deck"
      - "cdk/ `make` — the pattern it was modeled on"
    bullets:
      - "Bare `make` used to launch the full data → interactive → static pipeline — hitting GitLab and rendering the Quarto site; it now prints a formatted, grouped list of targets instead (`.DEFAULT_GOAL := help`)."
      - "The listing is produced from the Makefile itself: each target self-documents with an inline `## description`, and `##@ Section` lines become group headers — one source of truth, no separate help text to drift."
      - "A single `awk` one-liner over `$(MAKEFILE_LIST)` renders it — bold banners from `##@`, cyan target + description from every `target: ## …` line — the identical pattern already used by `cdk/Makefile`."
      - "Explicit targets (`make build`, `make redeploy`, `make deck`, …) still behave exactly as before."

  - title: "Printable Epic Cards — Portrait & Landscape  (#249, #254)"
    subtitle: "Filtered GitLab epics rendered to a print-ready vector PDF, cards to cut apart"
    issues: [249, 254]
    images:
      - "deck/assets/spotlight-extras/epic-cards-portrait.png"
      - "deck/assets/spotlight-extras/epic-cards-landscape.png"
    image_labels:
      - "Portrait — 2 cards per Letter sheet"
      - "Landscape — 2 cards per Letter sheet"
    bullets:
      - "The `epic-cards` tool pulls filtered epics from GitLab and renders cut-apart cards to a print-ready PDF — 1–4 cards per 8.5×11 sheet, with borders to cut on (#249)."
      - "Each card carries title, weight, description, mission-thread / action / main-system labels, related systems, and due date, driven by an operator-editable spec file."
      - "Page orientation is now a choice — portrait (8.5×11) or landscape (11×8.5) — exposed as both a CLI flag and a UI select, mirroring how `per_page` already works (#254)."
      - "Vector output prints crisp from any basic PDF reader — no rasterized screenshots, no app required to consume it."

  - title: "Epic Cards — Driven From the Web UI  (#249)"
    subtitle: "The whole card set is configured from one tool dialog — or the equivalent CLI"
    issues: [249]
    images:
      - "deck/assets/spotlight-extras/epic-cards-ui-dialog.png"
    caption: "The Epic Cards dialog — source group, cards/page, orientation, page size, wall grid, and card-spec; the matching CLI shown beneath"
    bullets:
      - "The epic-cards tool runs straight from the web UI's job picker (under 'Other') as well as the CLI — the same renderer and parameters either way."
      - "One dialog drives the entire output: source group, 1/2/4 cards per page, portrait or landscape, a large-format page size, an optional COLSxROWS 'wall' grid, and an operator-editable card-spec (filter + taxonomy)."
      - "Every field mirrors a copy-paste CLI command shown at the bottom of the dialog, so a UI experiment drops straight into a script or a CI job."

  - title: "Large-Format PI-Planning Wall  (#241)"
    subtitle: "The same renderer, sized in true inches for a plotter"
    issues: [241]
    images:
      - "deck/assets/spotlight-extras/epic-cards-largeformat.png"
    caption: "One wide sheet — media set in real-world inches, prints 1:1"
    bullets:
      - "The WeasyPrint engine behind the epic cards sizes its media in real-world inches via CSS `@page`, so the same pipeline emits a single large-format sheet a plotter prints at true size."
      - "Targets banner/roll media in the 36–60 in range with no manual rescaling — the hard part (a vector PDF whose media box is a true physical size) was de-risked by the epic-cards work."
      - "Lifts the PI-planning wall off the screen and onto a physical wall the team can plan against together."

  - title: "VM → Container SDLC — the Leadership Brief  (#243)"
    subtitle: "From hand-built developer VMs no one can fully explain to a container-based SDLC"
    issues: [243]
    images:
      - "slides/243-slide-brief-as-is-to-be/diagrams/asis-vm-sdlc.png"
      - "slides/243-slide-brief-as-is-to-be/diagrams/tobe-container-sdlc.png"
    image_labels:
      - "As-Is — hand-built developer VMs"
      - "To-Be — container-based SDLC"
    bullets:
      - "A leadership-facing brief frames the problem: a build the team depends on but that lives in hand-built VMs no one can fully explain or reproduce (#243)."
      - "The To-Be state moves developers to a container-based SDLC — edit locally in the IDE of choice, build inside a shared image, sync to GitLab for the outer loop."
      - "Built as a self-contained deck (`slides/243-slide-brief-as-is-to-be/`) on the same branding template, with reviewed As-Is / To-Be architecture diagrams."
      - "Calls out the advantages: a reproducible environment, forced understanding of the current dev/build VM, and one definition of the toolchain shared by every developer and CI."

  - title: "One Image, Three Roles — Dev · Build · CI  (#244)"
    subtitle: "The simulator itself now ships as a golden container"
    issues: [244]
    images:
      - "slides/243-slide-brief-as-is-to-be/diagrams/container-dev-workflow.png"
    caption: "Developer inner loop — mount the source, exec in, build with zero host toolchain"
    bullets:
      - "One Dockerfile defines the environment once and fills three roles — an interactive dev shell, the build, and CI — so there is a single source of truth for the toolchain (#244)."
      - "Developers pull the image, bind-mount their working tree at /app, and drop into a shell to build with zero tools installed on the host."
      - "On merge to develop the simulator's own runtime + dev images publish to the GitLab Container Registry, proving the pattern on a real project."
      - "`make dev-shell` / `make registry-push` wire the whole loop into the standard developer workflow."

  - title: "Any Toolchain — Python, Java & C/C++ Golden Images  (#247, #248)"
    subtitle: "The same container loop, demonstrated across three stacks"
    issues: [247, 248]
    images:
      - "slides/243-slide-brief-as-is-to-be/diagrams/tobe-container-sdlc-v2-multitoolchain.png"
    caption: "One golden-image pattern per team — any toolchain, same loop"
    bullets:
      - "Golden dev/build images prove the brief's claim that any team can adopt the pattern — Python shipped first, with real Java (#247) and C/C++ (#248) demo projects following."
      - "Each demo builds inside its image with no host toolchain and exercises both host use-cases: serve on a published port, and emit a runnable artifact to a bind-mounted output directory."
      - "Java uses a minimal Spring Boot service (JDK 21 + Maven → runnable fat jar); C/C++ uses its own compiler toolchain — different stacks, one workflow."
      - "Turns the brief's illustrative columns into commands that actually run, so the Java and C/C++ stories become demonstrable, not just described."
